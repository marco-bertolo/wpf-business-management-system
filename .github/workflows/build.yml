name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore packages
        run: nuget restore BusinessManagementSystem.sln

      - name: Build solution
        run: msbuild BusinessManagementSystem.sln /p:Configuration=Release /p:Platform="Any CPU" /m

